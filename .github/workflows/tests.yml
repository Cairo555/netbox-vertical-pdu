name: Plugin tests
on:
  push:
    branches: ["dev/**", main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: plugin-tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build exact Docker 5.1.2 image with plugin assets
        run: docker build -f development/Dockerfile -t netbox-vertical-pdu:test .
      - name: Start isolated web, worker, PostgreSQL and Redis services
        run: docker compose -p vpdu-smoke -f development/compose.smoke.yml up -d --wait --wait-timeout 900
      - name: Seed disposable test fixtures
        run: |
          mkdir -p test-results
          docker compose -p vpdu-smoke -f development/compose.smoke.yml exec -T netbox /opt/netbox/venv/bin/python /opt/netbox/netbox/manage.py shell --no-startup --no-imports < development/smoke_seed.py
          docker compose -p vpdu-smoke -f development/compose.smoke.yml cp netbox:/tmp/vpdu-smoke.json test-results/fixture.json
          docker compose -p vpdu-smoke -f development/compose.smoke.yml exec -T netbox-worker /opt/netbox/venv/bin/python /opt/netbox/netbox/manage.py check
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Exercise native UI in Chromium and capture screenshots
        run: python development/browser_smoke.py
      - name: Capture stack logs
        if: always()
        run: |
          mkdir -p test-results
          docker compose -p vpdu-smoke -f development/compose.smoke.yml ps --all > test-results/stack-status.txt
          docker compose -p vpdu-smoke -f development/compose.smoke.yml logs --no-color > test-results/stack.log
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: docker-browser-evidence
          path: test-results/
          retention-days: 14
      - name: Remove isolated test stack
        if: always()
        run: docker compose -p vpdu-smoke -f development/compose.smoke.yml down --volumes
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/check_wheel.py
  netbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
          POSTGRES_DB: netbox
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:8
        ports: ['6379:6379']
    env:
      NETBOX_CONFIGURATION: netbox.configuration_vpdu_testing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: netbox-community/netbox
          ref: f5bbfca66cc275730150dfb4ca1b158193e25296 # v4.7.5
          path: netbox-source
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install exact NetBox dependencies and plugin
        run: |
          sed -i 's/^psycopg\[c,pool\]==/psycopg[binary,pool]==/' netbox-source/requirements.txt
          python -m pip install -r netbox-source/requirements.txt
          python -m pip install .
          cp development/configuration_vpdu_testing.py netbox-source/netbox/netbox/
      - name: System and migration checks
        run: |
          python netbox-source/netbox/manage.py check
          python netbox-source/netbox/manage.py makemigrations netbox_vertical_pdu --check --dry-run
          python netbox-source/netbox/manage.py migrate --no-input
          python netbox-source/netbox/manage.py collectstatic --no-input
      - name: Integration tests against NetBox 4.7.5
        run: python netbox-source/netbox/manage.py test netbox_vertical_pdu.tests --no-input --verbosity 2
